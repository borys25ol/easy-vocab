[project]
name = "EasyVocab"
version = "0.1.0"
description = "EasyVocab - interactive web application for learning vocabulary"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.1",
    "bcrypt==4.3.0",
    "click>=8.3.1",
    "fastapi==0.128.0",
    "fastmcp==2.14.3",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "openai==2.15.0",
    "psycopg2-binary==2.9.11",
    "pydantic-settings==2.12.0",
    "pytest==9.0.2",
    "python-dotenv==1.2.1",
    "python-jose[cryptography]>=3.5.0",
    "requests==2.32.5",
    "ruff==0.14.13",
    "sqlalchemy==2.0.45",
    "sqlmodel==0.0.31",
    "uvicorn==0.40.0",
]

[tool.pytest.ini_options]
norecursedirs = [".ve"]
addopts = "-ra -q -s -v"

# pydantic-settings accepts _env_file and its siblings through
# BaseSettings.__init__, but ty synthesises __init__ from the model fields and
# so reports every such call as an unknown argument. The tests pass
# _env_file=None to keep the real .env out of the run, which left `ty check`
# permanently failing.
#
# Scoped to tests on purpose. Turning the rule off globally would also hide a
# genuine wrong-keyword call in app/, which is the case worth catching.
[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
unknown-argument = "ignore"

[dependency-groups]
dev = [
    "pre-commit==4.5.1",
    "ty>=0.0.14",
]
