name: Build and deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - "k8s/deployment.yaml"
      - "k8s/migrate-job.yaml"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Native arm64. The cluster runs aarch64, and QEMU emulation on an amd64
    # runner turns a three-minute uv build into roughly twenty.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/borys25ol/easy-vocab:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write the image tag into the manifests
        run: |
          # On the very first build these do not exist yet, and a missing file
          # must not fail the build that produces the image they reference.
          if [ ! -f k8s/deployment.yaml ]; then
            echo "no manifests yet, nothing to update"
            exit 0
          fi
          # The Deployment and the Job must run the same image, or migrations
          # apply a schema the application does not match.
          sed -i "s|image: ghcr.io/borys25ol/easy-vocab:.*|image: ghcr.io/borys25ol/easy-vocab:${{ github.sha }}|" \
            k8s/deployment.yaml k8s/migrate-job.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml k8s/migrate-job.yaml
          git diff --staged --quiet && echo "tag unchanged" && exit 0
          git commit -m "chore: deploy ${{ github.sha }} [skip ci]"
          git push
