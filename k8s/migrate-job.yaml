---
apiVersion: batch/v1
kind: Job
metadata:
  name: easy-vocab-migrate
  namespace: easy-vocab
  annotations:
    # A Sync hook, not PreSync. PreSync runs before the whole Sync phase, so
    # on a first deployment the ConfigMap and Secret this Job needs do not
    # exist yet and the sync deadlocks: it waits for the hook, the hook waits
    # for resources the sync has not applied.
    #
    # A Sync hook runs inside the Sync phase and honours sync waves, so it
    # lands after the configuration in wave 0 and before the Deployment in
    # wave 2.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    # A Job's pod template is immutable and CI rewrites the image on every
    # deploy. Deleting the previous Job before creating the next one avoids
    # the update entirely. `Replace=true` does not work here: kubectl replace
    # needs the full object, and Kubernetes generates spec.selector and the
    # template labels itself, so replacing drops them and is rejected.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # The sealed-secrets controller needs a moment to turn the SealedSecret into
  # a Secret. ArgoCD counts the SealedSecret healthy immediately, so this Job
  # can start a second early; the retries cover that gap.
  backoffLimit: 6
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          # Must match the Deployment. CI rewrites both together, or
          # migrations would apply a schema the application does not match.
          image: ghcr.io/borys25ol/easy-vocab:e32da4e6651553b5b6f5da6b97ec50a3e84fe88e
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: easy-vocab-config
            - secretRef:
                name: easy-vocab-env
